[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-review"
version = "0.1.1"
description = "Private local photo archive review tool for CasaOS"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  "pillow==11.3.0",
  "pillow-heif==1.1.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pytesseract==0.3.13",
  "onnxruntime==1.22.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "models/*.onnx"]
