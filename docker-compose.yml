name: photo-review

services:
  photo-review:
    build: .
    image: photo-review:local
    container_name: photo-review
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      PHOTO_REVIEW_PASSWORD: "change-me"
      PHOTO_REVIEW_SESSION_SECRET: "replace-with-a-long-random-string"
      PHOTO_REVIEW_OCR_LANGS: "rus+eng"
      TZ: "Asia/Yerevan"
    volumes:
      - /srv/storage/02_IMG/Photos:/photos
      - /srv/storage/02_IMG/Photo_Quarantine:/quarantine
      - ./photo-review-data:/data
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

x-casaos:
  architectures:
    - amd64
  main: photo-review
  port_map: "8088"
  scheme: http
  title:
    custom: Разбор фотографий
  description:
    custom: Локальная проверка и очистка фотоархива
  category: Media

